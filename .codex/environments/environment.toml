version = 1
name = "Codex_Account_Switch"

[setup]
script = ""

[[actions]]
name = "拉取新版本并进行冲突分析"
icon = "tool"
command = '''
git stash push -u -m "codex-auto-merge"
git fetch origin
git rebase origin/main
git stash apply "stash@{0}"
git diff --name-only --diff-filter=U > .codex-conflicts.txt
'''

[[actions]]
name = "冲突解决后推送到main"
icon = "tool"
command = '''
git stash drop "stash@{0}"
git add -A
git commit -m "Resolve merge conflicts"
git push origin HEAD:main
'''

[[actions]]
name = "移除当前分支"
icon = "tool"
command = '''
$branch = git branch --show-current
git switch main
git branch -D $branch
'''
