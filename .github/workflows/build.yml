name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A new push to a branch / PR cancels the in-flight CI run for the same ref.
# Tag builds keep their own concurrency group so a re-tag does not cancel a
# running release build.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI checks (Linux)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - run: npm ci

      - name: Type-check front-end
        run: npx tsc --noEmit

      - name: cargo check (lib)
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib

      - name: cargo test (lib)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  build:
    name: Build ${{ matrix.label }}
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            tauri_script: tauri:build:macos-release
            artifacts: |
              dist/*.dmg
              dist/*.pkg
          - label: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            tauri_script: tauri:build:macos-release
            artifacts: |
              dist/*.dmg
              dist/*.pkg
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            tauri_script: tauri:build:windows
            artifacts: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'
          key: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build (${{ matrix.tauri_script }})
        run: npm run ${{ matrix.tauri_script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-switch-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List collected artifacts
        run: |
          find artifacts -type f -maxdepth 4 | sort

      - name: Create draft release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/codex-switch-macos-arm64/*
            artifacts/codex-switch-macos-x86_64/*
            artifacts/codex-switch-windows-x86_64/*
